apiVersion: batch/v1
kind: Job
metadata:
  name: skillstreak-seed
  namespace: skillstreak
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U skillstreak; do
                echo "Waiting for postgres..."
                sleep 2
              done
              echo "Postgres is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: seed
          image: ghcr.io/vthiruveedhi/skillstreak:latest
          command:
            - sh
            - -c
            - |
              npm run db:push && npm run db:seed
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
