apiVersion: v1
kind: Secret
metadata:
  name: skillstreak-secrets
  namespace: skillstreak
type: Opaque
stringData:
  AUTH_PASSPHRASE: "CHANGE_ME_TO_YOUR_PASSPHRASE"
  AUTH_SECRET: "CHANGE_ME_TO_A_RANDOM_32_CHAR_STRING"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: skillstreak
type: Opaque
stringData:
  POSTGRES_USER: skillstreak
  POSTGRES_PASSWORD: "CHANGE_ME_TO_A_SECURE_PASSWORD"
  POSTGRES_DB: skillstreak
  DATABASE_URL: "postgresql://skillstreak:CHANGE_ME_TO_A_SECURE_PASSWORD@postgres:5432/skillstreak"
