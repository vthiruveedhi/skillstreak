apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillstreak
  namespace: skillstreak
  labels:
    app: skillstreak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: skillstreak
  template:
    metadata:
      labels:
        app: skillstreak
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: init-db
          image: ghcr.io/vthiruveedhi/skillstreak:latest
          command: ["node", "scripts/init-db.js"]
          env:
            - name: DATABASE_PATH
              value: /app/data/skillstreak.db
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      containers:
        - name: skillstreak
          image: ghcr.io/vthiruveedhi/skillstreak:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_PATH
              value: /app/data/skillstreak.db
            - name: NEXTAUTH_URL
              value: "http://skillstreak.skillstreak.svc.cluster.local:3000"
            - name: AUTH_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secrets
                  key: AUTH_PASSPHRASE
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secrets
                  key: NEXTAUTH_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skillstreak-data
