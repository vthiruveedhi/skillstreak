apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillstreak
  namespace: skillstreak
  labels:
    app: skillstreak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillstreak
  template:
    metadata:
      labels:
        app: skillstreak
    spec:
      containers:
        - name: skillstreak
          image: ghcr.io/vthiruveedhi/skillstreak:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secrets
                  key: AUTH_SECRET
            - name: AUTH_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: skillstreak-secrets
                  key: AUTH_PASSPHRASE
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/auth/session
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/auth/session
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
